name: Auto-update Version

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch:      # Allows you to run it manually

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Get latest Tag and Body
        id: upstream
        run: |
          # 1. Get the latest tag name
          TAG=$(curl -s https://api.github.com/repos/wetzel402/skylite-ux/tags | jq -r '.[0].name')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          # 2. Try to get release notes (falls back to "New version" if no release body exists)
          BODY=$(curl -s https://api.github.com/repos/wetzel402/skylite-ux/releases/tags/$TAG | jq -r '.body // "New upstream release detected."')
          
          # Clean up the body text to remove any "null" or weird characters
          if [ "$BODY" == "null" ]; then BODY="New version sync: $TAG"; fi
          echo "$BODY" > release_notes.txt

      - name: Check if update is needed
        id: check
        run: |
          if [ ! -f upstream_tag.txt ] || [ "$(cat upstream_tag.txt)" != "${{ steps.upstream.outputs.tag }}" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update Version and Changelog
        if: steps.check.outputs.update_needed == 'true'
        run: |
          # Bump version
          CURRENT_VERSION=$(grep 'version:' skylite-ux/config.yaml | awk '{print $2}' | tr -d '"')
          BASE_VERSION=$(echo $CURRENT_VERSION | cut -d. -f1-2)
          PATCH_VERSION=$(echo $CURRENT_VERSION | cut -d. -f3)
          NEW_VERSION="$BASE_VERSION.$((PATCH_VERSION + 1))"
          sed -i "s/^version: .*/version: \"$NEW_VERSION\"/" skylite-ux/config.yaml
          
          # Prepend to Changelog (with a cleaner separator)
          touch skylite-ux/CHANGELOG.md
          echo -e "## $NEW_VERSION\n- Synced with: ${{ steps.upstream.outputs.tag }}\n\n$(cat release_notes.txt)\n\n---\n\n$(cat skylite-ux/CHANGELOG.md)" > skylite-ux/CHANGELOG.md
          
          # Save tag
          echo "${{ steps.upstream.outputs.tag }}" > upstream_tag.txt

      - name: Commit and Push
        if: steps.check.outputs.update_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skylite-ux/config.yaml skylite-ux/CHANGELOG.md upstream_tag.txt
          git commit -m "Auto-sync v$(cat upstream_tag.txt) and update CHANGELOG"
          git push origin main
