name: Auto-update Version

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch:      # Allows you to run it manually

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Get latest Tag from Wetzel402
        id: upstream
        run: |
          # This specifically fetches the highest version tag
          LATEST_TAG=$(git ls-remote --tags --sort='v:refname' https://github.com/Wetzel402/skylite-ux.git | tail -n1 | sed 's/.*\///')
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Check if update is needed
        id: check
        run: |
          # Use 'upstream_tag.txt' to track the last version we saw
          if [ ! -f upstream_tag.txt ] || [ "$(cat upstream_tag.txt)" != "${{ steps.upstream.outputs.tag }}" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Increment Version in config.yaml
        if: steps.check.outputs.update_needed == 'true'
        run: |
          # This simple script bumps the last digit of your version (e.g., 1.0.2 -> 1.0.3)
          CURRENT_VERSION=$(grep 'version:' skylite-ux/config.yaml | awk '{print $2}' | tr -d '"')
          BASE_VERSION=$(echo $CURRENT_VERSION | cut -d. -f1-2)
          PATCH_VERSION=$(echo $CURRENT_VERSION | cut -d. -f3)
          NEW_VERSION="$BASE_VERSION.$((PATCH_VERSION + 1))"
          
          sed -i "s/version: .*/version: \"$NEW_VERSION\"/" skylite-ux/config.yaml
          echo "${{ steps.upstream.outputs.hash }}" > upstream_version.txt

      - name: Commit and Push
        if: steps.check.outputs.update_needed == 'true'
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add skylite-ux/config.yaml upstream_version.txt
          git commit -m "Auto-bump version to sync with Wetzel402 updates"
          git push
